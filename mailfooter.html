<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .content {
            width: 100%;
        }

        .content figure {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .content div {
            display: flex;
            flex-wrap: wrap;
            text-align: center;
            justify-content: center;
        }

        .content div h1 {
            font-family: "Roboto", sans-serif;
            font-optical-sizing: auto;
            font-weight: 700;
            display: inline-block;
            width: 100%;
            padding: 20px;
        }

        .content div p {
            font-family: "Roboto", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            padding: 0px 20px;
        }

        .content .info {
            padding: 20px 26px;
            display: flex;
            align-items: center;
            vertical-align: middle;
        }

        .content div ul {
            list-style: none;
        }

        .content div ul li {
            padding: 10px;
            text-align: start;
             font-family: "Roboto", sans-serif;
        }

        .content figure {
            width: 50%;
            margin: 0 auto;
        }

        .content figure img {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="content">
        <figure>
            <img src="./resources/maxiInflables_1.png" alt="LOGO">
        </figure>
        <div>
            <p>Porque la diversion nunca se acaba</p>
        </div>
        <div class="info">
            <p>Contacto:</p>
            <ul>
                <li>rentas@maxiinfables.com</li>
                <li>cotizaciones@maxiinfables.com</li>
                <li>241-191-0004</li>
                <li><a href="">www.maxiinflables.com</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
